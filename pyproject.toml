[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-transcriber"
version = "0.1.0"
description = "AI-powered music transcription: audio -> notes, MIDI and guitar tablature"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "mido>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3",
    "mir_eval>=0.7",
    "matplotlib>=3.7",
    "demucs>=4.0",  # stem separation (guitar, vocals)
    "beat-this>=1.1",  # song mode: beats and bar lines
]
train = [
    "pyroomacoustics>=0.7",  # room microphone augmentation (simulated rooms)
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools]
# `packages/music-core` is importable as `music_core`.
packages = [
    "music_core",
    "ml",
    "ml.preprocessing",
    "ml.datasets",
    "ml.models",
    "ml.training",
    "ml.evaluation",
    "ml.inference",
]
package-dir = { "music_core" = "packages/music-core" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI's Depends()/File() defaults are idiomatic
    "B905",  # zip() without strict=
]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "music_core"]
