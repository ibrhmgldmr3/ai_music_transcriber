# Lint, tests and a production build on every push and pull request. No datasets or
# model checkpoints are needed: the tests use synthetic audio and a fake predictor.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/api/requirements.txt
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg
      - name: Python packages
        run: |
          # CPU-only PyTorch: the CUDA wheels are gigabytes and unused here.
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml,dev]" -r apps/api/requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
